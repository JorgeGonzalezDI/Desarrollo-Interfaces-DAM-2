<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Control de Acceso</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Iniciar Sesión</ion-card-title>
      <ion-card-subtitle>Introduce tus credenciales del sistema</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <!-- Aviso cuando authGuard nos ha redirigido desde una ruta protegida -->
      @if (returnUrl()) {
        <ion-note color="warning" class="aviso">
          Ruta protegida: inicia sesión para acceder a <strong>{{ returnUrl() }}</strong>
        </ion-note>
      }

      <!-- (keyup.enter) permite entrar pulsando Enter -->
      <ion-input
        class="ion-margin-bottom"
        label="Usuario"
        labelPlacement="floating"
        fill="outline"
        type="text"
        placeholder="admin u operador"
        [(ngModel)]="username"
        (keyup.enter)="handleLogin()"
      ></ion-input>

      <ion-input
        class="ion-margin-bottom"
        label="Contraseña"
        labelPlacement="floating"
        fill="outline"
        type="password"
        placeholder="123"
        [(ngModel)]="password"
        (keyup.enter)="handleLogin()"
      ></ion-input>

      <ion-button expand="block" (click)="handleLogin()" class="ion-margin-top">
        Acceder al Panel
      </ion-button>

      @if (errorMessage()) {
        <ion-text color="danger">
          <p class="ion-text-center">{{ errorMessage() }}</p>
        </ion-text>
      }

      <p class="pista">Usuarios de prueba: <code>admin / 123</code> (rol admin) · <code>operador / 123</code> (rol user)</p>
    </ion-card-content>
  </ion-card>
</ion-content>
