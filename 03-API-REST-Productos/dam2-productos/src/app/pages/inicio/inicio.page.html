<ion-header>
  <ion-toolbar>
    <ion-title>Inicio</ion-title>
    <!-- Petición 9: botón de modo oscuro. El icono cambia según el signal dark() -->
    <ion-buttons slot="end">
      <ion-button (click)="theme.toggle()">{{ theme.dark() ? '☀️' : '🌙' }}</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>DAM2 - API REST</h1>
  <p>Aplicación Ionic + Angular Standalone para consumir una API REST.</p>

  <!-- routerLink navega a la ruta /productos (la definida en app.routes.ts) -->
  <ion-button routerLink="/productos">Ver productos</ion-button>

  <!-- Petición 4: enlace a la página About -->
  <ion-button routerLink="/about" fill="outline">About</ion-button>
</ion-content>
