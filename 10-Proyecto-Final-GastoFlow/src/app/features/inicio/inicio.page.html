<ion-header>
  <ion-toolbar color="primary">
    <!-- Botón hamburguesa: solo se ve en móvil/tablet (en escritorio el menú está fijo) -->
    <ion-buttons slot="start">
      <ion-menu-button aria-label="Abrir menú"></ion-menu-button>
    </ion-buttons>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <main>
    <!-- role="alert": el lector de pantalla lo anuncia nada más aparecer -->
    @if (denegado()) {
      <ion-note color="danger" class="aviso" role="alert">
        No tienes permiso para acceder a <strong>{{ denegado() }}</strong>.
      </ion-note>
    }

    <ion-card>
      <ion-card-header>
        <ion-card-title>
          <h1 class="titulo-card">Hola, {{ auth.sesion()?.nombre }}</h1>
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>
          Has entrado como <strong>{{ auth.nombreRol() }}</strong>
          ({{ auth.sesion()?.departamento }}).
        </p>
        <p>Usa el menú para moverte por las secciones a las que tienes acceso.</p>
      </ion-card-content>
    </ion-card>
  </main>
</ion-content>
